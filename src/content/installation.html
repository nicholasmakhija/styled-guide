<p>Install Styled using your favourite package manager:</p>

<pre><code><!--
--><span data-grey># with npm</span>
<span data-green>npm</span> install @n3e/styled

<span data-grey># with yarn</span>
<span data-green>yarn</span> add @n3e/styled

<span data-grey># with pnpm</span>
<span data-green>pnpm</span> add @n3e/styled

<span data-grey># with bun</span>
<span data-green>bun</span> add @n3e/styled
</code></pre>

<p>Once installed, just import like so:</p>

<pre><code><!--
--><span data-pink>import</span> styled <span data-pink>from</span> <span data-yellow>'@n3e/styled'</span>;
</code></pre>
